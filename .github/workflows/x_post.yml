# ダビマス更新の週次バッチ:
# 1) 最新情報取得 2) 画像生成 3) JSON更新 4) リポジトリ反映 5) X投稿
name: Weekly Dabimas Update

on:
  # GitHub Actions 画面から手動実行
  workflow_dispatch:
  schedule:
    # cron は UTC 指定: 毎週金曜 04:07 UTC (= 13:07 JST) に前倒しで起動し、
    # ジョブ先頭で 18:30 JST まで待機する（GitHub schedule の数時間遅延への対策）。
    # 詳細: docs/x-post-schedule-fix-plan.md
    - cron: "7 4 * * 5"

permissions:
  # JSON 更新結果を commit/push するために必要
  contents: write

concurrency:
  # 同時多重実行を避ける（先行ジョブはキャンセルしない）
  group: weekly-dabimas-update
  cancel-in-progress: false

jobs:
  weekly-pipeline:
    # 実行環境と制限時間（18:30 JST までの待機 最大約5.5h + 実処理 1h をカバー）
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # 血統マスター(R2)の読み取り専用トークン。これが無いと build が
      # nodeId / pedigreeId / mares の無い json を生成して main へ push してしまう。
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      # 前倒し起動からデータ公開後の 18:30 JST まで待つ。
      # 起動が 18:30 を過ぎるほど遅延した場合は待たずに即実行する。
      - name: Wait until 18:30 JST
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Tokyo date -d 'today 18:30' +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Waiting $(( (target - now) / 60 )) minutes until 18:30 JST..."
            sleep $(( target - now ))
          else
            echo "Already past 18:30 JST. Run immediately."
          fi

      # リポジトリのコードを runner に取得（待機後に取得して最新の main を使う）
      - uses: actions/checkout@v5

      # Python 実行環境を準備
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # スクリプト実行に必要な依存関係をインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # 最新の種牡馬情報を収集してテキスト化
      - name: Fetch latest news
        run: |
          python scripts/fetch_latest_news.py \
            --out latest_stallions.txt \
            --news-out latest_news_snapshot.txt

      - name: Detect latest news changes
        id: latest_news
        shell: bash
        run: |
          SNAPSHOT=.github/state/latest_news_snapshot.txt
          PREVIOUS_SNAPSHOT="$(mktemp)"
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
          git show origin/main:"$SNAPSHOT" > "$PREVIOUS_SNAPSHOT" 2>/dev/null || true

          if [ -s "$PREVIOUS_SNAPSHOT" ] && cmp -s latest_news_snapshot.txt "$PREVIOUS_SNAPSHOT"; then
            echo "news_changed=false" >> "$GITHUB_OUTPUT"
            echo "Latest news did not change. Skip data update steps."
            rm -f "$PREVIOUS_SNAPSHOT"
            exit 0
          fi

          mkdir -p "$(dirname "$SNAPSHOT")"
          cp latest_news_snapshot.txt "$SNAPSHOT"
          rm -f "$PREVIOUS_SNAPSHOT"
          echo "news_changed=true" >> "$GITHUB_OUTPUT"

      # 取得したテキストを投稿用画像に変換
      - name: Render latest stallions image
        if: ${{ steps.latest_news.outputs.news_changed == 'true' }}
        run: |
          python scripts/txt_to_png.py \
            --input latest_stallions.txt \
            --output latest_stallions.png \
            --font-path fonts/NotoSansCJKjp-Regular.otf

      # 公開用 json を生成（full + 初期ロード軽量化用の summary / detail 分割 + 血統ノード辞書）
      # dataset_version はここでは固定しない。週次の自動実行なので、R2 側が
      # 更新されるたびに落ちてしまう。2 ファイル間の版一致検査は常に効いている。
      - name: Build dabimasFactor.json
        if: ${{ steps.latest_news.outputs.news_changed == 'true' }}
        run: |
          python scripts/build_dabimas_stream.py \
            --output json/dabimasFactor.json \
            --summary-output json/dabimasFactor.summary.json \
            --details-output-dir json/dabimasFactor-details \
            --pedigree-nodes-output json/pedigreeNodes.json \
            --r2-endpoint "$R2_ENDPOINT_URL" \
            --detail-chunk-size 128 \
            --progress 200 \
            --fail-on-error

      # service-worker.js の CACHE_NAME を dabimas-factor-vYYYYMMDD-01 へ更新
      - name: Update CACHE_NAME in service-worker.js
        if: ${{ steps.latest_news.outputs.news_changed == 'true' }}
        run: |
          python - <<'PY'
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sw_path = Path("service-worker.js")
          src = sw_path.read_text(encoding="utf-8")

          ymd = datetime.now(ZoneInfo("Asia/Tokyo")).strftime("%Y%m%d")
          cache_name = f"dabimas-factor-v{ymd}-01"

          updated, count = re.subn(
              r"(?m)^var CACHE_NAME = '.*';$",
              f"var CACHE_NAME = '{cache_name}';",
              src,
              count=1,
          )
          if count != 1:
              raise RuntimeError("CACHE_NAME line was not found in service-worker.js")

          sw_path.write_text(updated, encoding="utf-8")
          print(f"Updated CACHE_NAME: {cache_name}")
          PY

      # json と service-worker.js を同じコミットで main に反映
      - name: Commit and push JSON + service-worker cache name
        if: ${{ steps.latest_news.outputs.news_changed == 'true' }}
        run: |
          TODAY="$(TZ=Asia/Tokyo date +'%Y-%m-%d')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/state/latest_news_snapshot.txt \
            json/dabimasFactor.json \
            json/dabimasFactor.summary.json \
            json/dabimasFactor-details \
            json/pedigreeNodes.json \
            service-worker.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update json/dabimasFactor.json and CACHE_NAME (${TODAY})"
            git push
          fi

      # 画像付きで X に投稿
      - name: Post to X
        if: ${{ steps.latest_news.outputs.news_changed == 'true' && success() }}
        id: post_to_x
        env:
          # X API の認証情報（リポジトリ Secrets）
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          # 投稿本文
          X_TWEET_TEXT: |
            ダビふぁくのデータを更新しました。
            追加データは添付画像をご確認ください。
            #ダビマス
          # 添付画像ファイル
          X_MEDIA_PATH: latest_stallions.png
        run: |
          python scripts/post_to_x.py

      # 最新情報が前回と同じ場合はおやすみ告知だけ X に投稿
      - name: Post no-change notice to X
        if: ${{ steps.latest_news.outputs.news_changed == 'false' && success() }}
        id: post_no_change_to_x
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_TWEET_TEXT: |
            だびふぁくの本日のデータ更新はドリコム様のご都合によりおやすみです。ご意見があればドリコム様へおねがいします。
            #ダビマス
        run: |
          python scripts/post_to_x.py

      # Refresh token を Secrets にローテーション保存
      - name: Rotate X refresh token in GitHub Secrets
        if: ${{ always() && (steps.post_to_x.outputs.new_refresh_token != '' || steps.post_no_change_to_x.outputs.new_refresh_token != '') }}
        env:
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          NEW_X_REFRESH_TOKEN: ${{ steps.post_to_x.outputs.new_refresh_token || steps.post_no_change_to_x.outputs.new_refresh_token }}
        run: |
          python scripts/update_repo_secret.py \
            --secret-name X_REFRESH_TOKEN \
            --secret-value-env NEW_X_REFRESH_TOKEN

