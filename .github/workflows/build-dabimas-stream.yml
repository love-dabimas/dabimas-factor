name: Build Dabimas Stream

on:
  workflow_dispatch:
    inputs:
      delay:
        description: "Delay seconds between requests"
        required: false
        default: "0"
      limit:
        description: "Process first N URLs only (0 = all)"
        required: false
        default: "0"
      pedigree_dataset_version:
        description: "Expected pedigree dataset_version (empty = skip validation)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build JSON
        run: |
          mkdir -p artifacts
          python scripts/build_dabimas_stream.py \
            --output artifacts/dabimasFactor.json \
            --summary-output artifacts/dabimasFactor.summary.json \
            --details-output-dir artifacts/dabimasFactor-details \
            --pedigree-nodes-output artifacts/pedigreeNodes.json \
            --r2-endpoint "$R2_ENDPOINT_URL" \
            --pedigree-dataset-version "${{ github.event.inputs.pedigree_dataset_version }}" \
            --detail-chunk-size 128 \
            --all-output artifacts/all_rows.ndjson \
            --delay "${{ github.event.inputs.delay || '0' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --progress 200 \
            --fail-on-error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dabimas-stream
          path: artifacts/
