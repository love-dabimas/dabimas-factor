<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Phase 4a UI 検証</title>
<style>body{margin:0}iframe{width:390px;height:844px;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><iframe id="app" src="../index.html"></iframe><pre id="result">PENDING</pre>
<script>
(async () => {
  const result = { status: 'RUNNING', checks: [], maps: [], errors: [] };
  const output = () => document.querySelector('#result').textContent = JSON.stringify(result);
  const heartbeat = setInterval(output, 100);
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const check = (ok, label) => { if (!ok) throw Error(label); result.checks.push(label); };
  async function until(test, label) {
    for (let i = 0; i < 1000; i++) { if (test()) return; await wait(100); }
    throw Error('timeout: ' + label);
  }
  const frame = document.querySelector('#app');
  const all = (node, name) => [ ...(node.$options.name === name || node.$options._componentTag === name ? [node] : []),
    ...node.$children.flatMap(child => all(child, name)) ];
  try {
    await until(() => frame.contentWindow.__debugAppInstance?.horseSummaryLoaded &&
      frame.contentWindow.__debugAppInstance.brosData?.length &&
      frame.contentDocument.querySelector('#loader')?.classList.contains('loaded'), 'boot');
    const win = frame.contentWindow, doc = frame.contentDocument, app = win.__debugAppInstance;
    win.addEventListener('error', event => result.errors.push(event.message));
    win.addEventListener('unhandledrejection', event => result.errors.push(String(event.reason)));
    app.currentScreen = 'assist'; await app.$nextTick();
    const screen = all(app, 'assist-screen')[0], host = all(app, 'musume-host')[0];
    const horses = (await (await fetch('../json/dabimasFactor.json')).json()).horseLists;
    const mare = horses.find(h => h.name === 'スターベガ' && h.sex === '1');
    const altair = horses.find(h => h.name === 'スターアルタイル' && h.subName === '瓏覇');
    const other = horses.find(h => h.sex === '1' && h.name === 'アドマイヤグルーヴ');
    const logic = win.Dabimas.logic;
    // Phase 4b を待たずに、契約どおりの受信メッセージを実 iframe から流す。
    const rows = horses.filter(h => h.sex === '0').map(h => {
      const board = logic.plan.expandHorseBoard(h, app.brosData);
      return [logic.musumeLink.toMusumeKey(h.id), board[1].parentLine, board[5].parentLine,
        board[3].parentLine + board[7].parentLine, [9,11,13,15].map(i => board[i].parentLine).join('')];
    });
    async function open(step) {
      const section = doc.querySelector('.assist-gen--' + (step || 1));
      const buttons = [...section.querySelectorAll('button')];
      const button = step === 0 ? buttons.find(b => /繁殖牝馬を選ぶ|選び直す/.test(b.textContent)) :
        buttons.find(b => b.textContent.includes('種牡馬を選ぶ'));
      check(!!button, '選択ボタン STEP ' + step); button.click(); await app.$nextTick();
      await until(() => host.sheetOpen && host.$refs.sheetFrame?.contentWindow?.location.pathname === '/dabimas-data/dist/' &&
        host.$refs.sheetFrame?.contentDocument?.readyState === 'complete', 'sheet');
      const child = host.$refs.sheetFrame.contentWindow;
      check(!!doc.querySelector('.musume-sheet-dialog') && !screen.$el.querySelector('.v-autocomplete'), 'ダビ娘シート STEP ' + step);
      if (!child.__phase4aIntercepted) {
        child.__phase4aIntercepted = true;
        const original = child.postMessage.bind(child);
        child.postMessage = (message, ...args) => {
          if (message.type === 'dabimas:theory-map') result.maps.push(JSON.parse(JSON.stringify(message)));
          return original(message, ...args);
        };
      }
      const emit = message => child.eval('parent.postMessage(' + JSON.stringify({ v: 1, ...message }) + ', location.origin)');
      emit({ type: 'dabimas:hello' });
      emit({ type: 'dabimas:candidates', rows });
      if (step) await until(() => result.maps.at(-1)?.mareKey === host.target.theoryMap.mareKey, 'theory-map');
      return emit;
    }
    async function choose(step, horse) {
      const emit = await open(step);
      emit({ type: 'dabimas:select', horseId: horse.id.slice(1), gender: horse.sex, name: horse.name });
      await until(() => !host.sheetOpen && !screen.busy && (step ? screen.plan.steps[step - 1].sire?.id === horse.id : screen.baseMare?.id === horse.id), 'selected');
      await app.$nextTick();
    }
    await choose(0, mare);
    check(result.maps.length === 0, '母の選択では理論マップなし');
    await choose(1, altair);
    const firstKey = result.maps.at(-1).mareKey;
    check(firstKey === logic.musumeLink.toMusumeKey(mare.id), '実在母の mareKey');
    check(result.maps.at(-1).entries.filter(entry => entry[1] & 1).length === 6, 'postMessage 完璧6頭');
    await choose(2, altair);
    check(result.maps.at(-1).mareKey.startsWith('virtual-2-'), '仮想産駒の mareKey');
    await choose(0, other);
    check(!screen.plan.steps[1].sire && !screen.plan.steps[1].mareLines && !screen.plan.steps[2].mareLines, '母変更で後続を破棄');
    await open(1);
    check(result.maps.at(-1).mareKey !== firstKey, '母変更で mareKey 更新');
    check(doc.documentElement.scrollWidth <= 390, '390px 横スクロールなし');
    check(!result.errors.length, '実行時エラーなし');
    result.status = 'OK';
  } catch (error) { result.status = 'FAILED'; result.failure = String(error.stack || error); }
  finally { clearInterval(heartbeat); output(); }
})();
</script></body></html>
