<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Phase 2e save verification</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}#result{display:none}</style></head>
<body><iframe id="app"></iframe><pre id="result">PENDING</pre>
<script>
(async () => {
  const result = { errors: [] };
  const heartbeat = setInterval(() => {
    document.querySelector('#result').textContent = JSON.stringify(result);
  }, 100);
  const frame = document.querySelector('iframe');
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const check = (ok, message) => { if (!ok) throw Error(message); };
  try {
    result.stage = 'unregister';
    const registrations = await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(registration => registration.unregister()));
    result.stage = 'caches';
    const cacheNames = await caches.keys();
    await Promise.all(cacheNames.map(name => caches.delete(name)));
    if (navigator.serviceWorker.controller) {
      location.replace(location.pathname + '?clean=' + Date.now());
      return;
    }
    result.cleanStart = { registrations: (await navigator.serviceWorker.getRegistrations()).length, caches: (await caches.keys()).length, controller: !!navigator.serviceWorker.controller };
    check(result.cleanStart.registrations === 0 && result.cleanStart.caches === 0 && !result.cleanStart.controller, 'SW cleanup failed');
    const html = (await (await fetch('../index.html', {cache:'reload'})).text())
      .replace(/(<script src="\.\/[^"?]+\.js)(")/g, '$1?verify=' + Date.now() + '$2');
    const capture = '<base href="http://127.0.0.1:8767/"><script>window.__p2dErrors=[];const originalError=console.error;console.error=(...args)=>{window.__p2dErrors.push(args.map(String).join(" "));originalError.apply(console,args)};window.addEventListener("error",e=>window.__p2dErrors.push(e.message||"resource error"));window.addEventListener("unhandledrejection",e=>window.__p2dErrors.push(String(e.reason)));<\/script>';
    frame.srcdoc = html.replace('<head>', '<head>' + capture);
    let app;
    for (let i = 0; i < 200; i++) {
      app = frame.contentWindow.__debugAppInstance;
      if (app?.horseSummaryLoaded && app.horsesBase?.length && frame.contentWindow.Dabimas.pedigreeNodes && app.inbreedExceptions?.length) break;
      await wait(100);
    }
    result.boot = { app: !!app, screen: app?.currentScreen, loaded: app?.horseSummaryLoaded, horseCount: app?.horsesBase?.length, text: frame.contentDocument.body.innerText.slice(0,1000) };
    check(app?.horsesBase?.length, 'app did not load');
    const win = frame.contentWindow;
    check(win.Dabimas.logic.inbreed.judgeInbreed.toString().includes('resolveBoardRefs'), 'old detector loaded');
    app.currentScreen = 'category'; app.dispCategory = 0;
    const find = (name, subName) => {
      const horse = app.horsesBase.find(h => h.name === name && (subName === undefined || h.subName === subName));
      check(horse, 'missing horse ' + name + subName); return horse;
    };
    const sunday = find('サンデーサイレンス','1989');
    const partholon = find('パーソロン','1971');
    const luna = find('スイートルナ');
    const teio = find('トウカイテイオー','');
    const findDialog = (component) => component.$options._componentTag === 'combination-dialog'
      ? component : component.$children.map(findDialog).find(Boolean);
    const dialog = findDialog(app);
    check(dialog, 'dialog missing'); await dialog.init();
    await app.$nextTick();
    check(dialog.identityResolver === app.identityResolver, 'resolver prop not connected');
    const storage = win.Dabimas.logic.storage.combinationStorage;
    async function saveActual(kind,title) {
      check(app.allHorsesSet, 'incomplete save board');
      app.persistSelectedToStorage();
      const previous = new Set((await storage.loadCustomHorses(dialog.db)).map(r=>r.id));
      dialog.saveKind = kind; dialog.newTitle = title;
      await dialog.saveConfig();
      const saved = (await storage.loadCustomHorses(dialog.db)).find(r=>!previous.has(r.id));
      check(saved, 'save failed ' + dialog.toast.message);
      await app.loadCustomHorseDetails(); await app.$nextTick();
      return saved;
    }
    app.initializer();
    await app.onChangeMain(0,0,sunday);
    await app.onChangeMain(1,1,partholon);
    await app.onChangeMain(1,3,luna);
    result.placeholder = {name:app.selected[16].name,ref:app.selected[16].identityRef || null};
    check(result.placeholder.ref === null, 'must reproduce unnormalized root');
    const saved = await saveActual('broodmare','ザサンデー');
    result.saved = {id:saved.id,fatherRef:saved.fatherRef,motherRef:saved.motherRef,mareRefs:saved.mareRefs};
    check(saved.motherRef?.kind === 'implied', 'missing saved implied mother');
    check(saved.motherRef.fatherRef.nodeId === '0000333257-01' && saved.motherRef.motherRef.nodeId === '0000050973-00', 'wrong mother parents');
    check(saved.fatherRef.nodeId === '0000333862-01', 'father changed');
    win.Dabimas.logic.horses.MARE_SOURCE_IDS.forEach((source,slot)=>{
      if(source[0] === 'dam') check(saved.mareRefs[slot]?.kind !== 'unknown', 'unknown saved mare '+slot);
    });
    // A real father-side generated placeholder, persisted through the dialog as a stallion.
    app.initializer();
    await app.onChangeMain(1,0,luna);
    await app.onChangeMain(0,1,teio);
    await app.onChangeMain(0,3,luna);
    result.paternalPlaceholder = {name:app.selected[0].name,ref:app.selected[0].identityRef || null};
    const paternal = await saveActual('stallion','父積み上げ');
    result.paternal = {fatherRef:paternal.fatherRef};
    check(paternal.fatherRef?.kind === 'implied', 'missing saved implied father');
    // Reproduce the reported placement order, deepest first.
    app.initializer();
    await app.onChangeMain(0,0,teio);
    await app.onChangeMain(1,15,{...saved,source:'custom'});
    await app.onChangeMain(1,7,find('アイスカペイド','極走'));
    await app.onChangeMain(1,3,find('アイリッシュリヴァー','覇走'));
    await app.onChangeMain(1,1,find('アイネスフウジン','覇煌'));
    const report = win.Dabimas.logic.inbreed.judgeInbreed(app.selected,app.inbreedExceptions,win.Dabimas.pedigreeNodes,app.identityResolver);
    result.report4 = {colors:report.inbreedColorIndexes,count:report.count,dangerous:report.dangerous,crosses:report.crosses};
    check(JSON.stringify(report.inbreedColorIndexes) === '[1,12,30,14,26]', 'report colors');
    check(report.count === 5 && !report.dangerous, 'report count/danger');
    check(JSON.stringify(report.crosses.map(c=>c.bloodVolume)) === '[28125,6250,6250]', 'report volumes');
    check(JSON.stringify(report.crosses[0].occurrences.map(o=>o.path)) === '["F","MMMM"]', 'report paths');
    await app.$nextTick();
    result.errors = win.__p2dErrors;
    check(result.errors.length === 0, 'console errors');
    result.status = 'OK';
  } catch (error) {
    result.status = 'FAILED'; result.message = String(error.stack || error);
    result.errors = frame.contentWindow.__p2dErrors || result.errors;
  }
  document.querySelector('#result').textContent = JSON.stringify(result);
  clearInterval(heartbeat);
  document.body.dataset.status = result.status;
})();
</script></body></html>
