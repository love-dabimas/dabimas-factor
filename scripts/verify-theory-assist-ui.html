<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>配合理論補助 UI 検証</title>
<style>html,body{margin:0}iframe{width:375px;height:844px;border:0}#result{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><iframe id="app"></iframe><pre id="result">PENDING</pre>
<script>
// 専用のローカル検証ポートで開く。実際の画面・候補一覧・詳細取得を通す。
(async () => {
  const result = { status: 'RUNNING', checks: [], errors: [] };
  const output = () => document.querySelector('#result').textContent = JSON.stringify(result);
  const heartbeat = setInterval(output, 100);
  const frame = document.querySelector('iframe');
  if (new URLSearchParams(location.search).get('view') === 'overview') frame.style.height = '1400px';
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const check = (ok, label) => { if (!ok) throw Error(label); result.checks.push(label); };
  async function until(test, label) {
    for (let i = 0; i < 600; i++) { if (test()) return; await wait(100); }
    throw Error('timeout: ' + label);
  }
  let app, win, doc, screen;
  const all = (node, name) => [ ...(node.$options.name === name || node.$options._componentTag === name ? [node] : []),
    ...node.$children.flatMap(child => all(child, name)) ];
  const clickText = (parent, selector, text) => {
    const node = [...parent.querySelectorAll(selector)].find(node => node.textContent.includes(text));
    if (!node) throw Error('missing: ' + selector + ' ' + text);
    node.click();
  };
  async function boot() {
    const previous = frame.contentWindow.__debugAppInstance;
    frame.src = '../index.html?assist-verify=' + Date.now();
    await until(() => frame.contentWindow.__debugAppInstance && frame.contentWindow.__debugAppInstance !== previous &&
      frame.contentWindow.__debugAppInstance.horseSummaryLoaded && frame.contentWindow.__debugAppInstance.brosData?.length &&
      frame.contentDocument.querySelector('#loader')?.classList.contains('loaded'), 'boot');
    win = frame.contentWindow; doc = frame.contentDocument; app = win.__debugAppInstance;
    win.addEventListener('error', event => result.errors.push(event.message));
    win.addEventListener('unhandledrejection', event => result.errors.push(String(event.reason)));
    const originalError = win.console.error;
    win.console.error = (...args) => { result.errors.push(args.map(String).join(' ')); originalError.apply(win.console, args); };
    await app.$nextTick();
  }
  function noOverflow(label) {
    const element = doc.querySelector('.assist-screen') || doc.querySelector('.dabimas-home');
    check(win.innerWidth === 375 && doc.documentElement.scrollWidth <= 375 && element.scrollWidth <= element.clientWidth,
      '375px 横スクロールなし: ' + label);
  }
  async function choose(step, name, subName) {
    const generation = doc.querySelector('.assist-gen--' + (step || 1));
    if (step === 0) clickText(generation, 'button', screen.baseMare ? '選び直す' : '繁殖牝馬を選ぶ');
    else if (screen.plan.steps[step - 1].sire) clickText(generation.querySelectorAll('.assist-horse')[1], 'button', '選び直す');
    else clickText(generation, 'button', '種牡馬を選ぶ');
    await app.$nextTick();
    const host = all(app, 'musume-host')[0];
    await until(() => host.sheetOpen && host.$refs.sheetFrame?.contentWindow?.location.pathname === '/dabimas-data/dist/' &&
      host.$refs.sheetFrame?.contentDocument?.readyState === 'complete', 'sheet');
    const horse = (step ? app.stallions : app.broodmares).find(h => h.name === name && (!subName || h.subName === subName));
    check(!!horse && !screen.$el.querySelector('.v-autocomplete'), 'ダビ娘選択入口 ' + name);
    // 受け手 Phase 4b と独立に、実 iframe から選択メッセージを送る。
    host.$refs.sheetFrame.contentWindow.eval('parent.postMessage(' + JSON.stringify({
      type: 'dabimas:select', v: 1, horseId: horse.id.slice(1), gender: horse.sex, name: horse.name,
    }) + ', location.origin)');
    await until(() => !screen.busy && !host.sheetOpen &&
      (step ? screen.plan.steps[step - 1].sire?.id === horse.id : screen.baseMare?.id === horse.id), 'selection ' + name);
    await app.$nextTick();
  }
  try {
    // この検証オリジンの古いService Workerが更新前のJSを返すのを防ぐ。
    await Promise.all((await navigator.serviceWorker.getRegistrations()).map(reg => reg.unregister()));
    await Promise.all((await caches.keys()).map(name => caches.delete(name)));
    if (navigator.serviceWorker.controller) { location.reload(); return; }
    await boot();
    await win.Dabimas.workspaceSync.goHome(); await app.$nextTick();
    noOverflow('ホーム');
    const home = all(app, 'home-page')[0];
    home.editMode = true; await app.$nextTick();
    const tile = [...doc.querySelectorAll('.dabimas-musume-tile')].find(node => node.textContent.includes('配合理論補助'));
    check(tile && !tile.querySelector('.dabimas-category-delete,.dabimas-category-reorder'), 'ホームの固定タイル');
    tile.click(); await app.$nextTick();
    check(app.currentScreen === 'assist', '4a タイルから開く');
    screen = all(app, 'assist-screen')[0];
    noOverflow('初期状態');
    await choose(0, 'スターベガ');
    check(doc.querySelectorAll('.assist-waiting').length === 2 && screen.plan.isSelectable(1), '4b 繁殖牝馬選択、2・3代目待ち');
    await choose(1, 'スターアルタイル', '瓏覇');
    check(doc.querySelector('.assist-theory-badge').textContent === '完璧な配合' &&
      doc.querySelector('.assist-gen--2').textContent.includes('1代目配合の繁殖牝馬'), '4c 理論と次代の母');
    noOverflow('1代目選択');
    await choose(2, 'スターアルタイル', '瓏覇');
    await choose(3, 'スターアルタイル', '瓏覇');
    check(doc.querySelectorAll('.assist-theory-badge').length === 3, '4d 3代目まで選択');
    noOverflow('3代目選択');
    const scroller = doc.querySelector('.assist-screen');
    scroller.scrollTop = scroller.scrollHeight;
    check(scroller.scrollTop > 0, '3代目まで縦スクロール可能');
    await choose(1, 'サンデーサイレンス', '1989');
    check(doc.querySelectorAll('.assist-theory-badge').length === 1 &&
      !screen.plan.steps[1].sire && !screen.plan.steps[2].mareLabel && !screen.plan.steps[2].sireLines, '4e 後続の選択・結果を破棄');
    await choose(0, 'スターベガ');
    check(doc.querySelectorAll('.assist-theory-badge').length === 0 && doc.querySelectorAll('.assist-waiting').length === 2,
      '母の選び直しで計画を再作成');
    await until(() => !screen.busy, 'idle'); await wait(300);
    await boot();
    check(app.currentScreen === 'assist', 'assist画面の起動時復元');
    screen = all(app, 'assist-screen')[0];
    clickText(doc.querySelector('.assist-head'), 'button', 'ホーム');
    await until(() => app.currentScreen === 'home', 'home');
    const created = await win.Dabimas.workspaceSync.addCategory({ name: '配合理論補助UI検証', iconKey: 'mdi-folder' });
    await win.Dabimas.workspaceSync.goHome();
    await app.$nextTick();
    clickText(doc, '.dabimas-category-card', '配合理論補助UI検証');
    await until(() => app.currentScreen === 'category', 'category');
    await app.onChangeMain(0, 0, app.stallions.find(h => h.name === 'スターアルタイル' && h.subName === '瓏覇'));
    await app.$nextTick();
    check(doc.querySelector('header').getBoundingClientRect().height > 0 &&
      doc.body.innerText.includes('スターアルタイル'), '5 ホーム→カテゴリ→血統表、種牡馬表示');
    if (new URLSearchParams(location.search).get('view') !== 'category') {
      await win.Dabimas.workspaceSync.goHome(); await app.$nextTick();
      await win.Dabimas.workspaceSync.removeCategory(created.category.id);
      clickText(doc, '.dabimas-musume-tile', '配合理論補助'); await app.$nextTick();
      screen = all(app, 'assist-screen')[0];
      await choose(0, 'スターベガ'); await choose(1, 'スターアルタイル', '瓏覇');
      doc.querySelector('.assist-screen').scrollTop = 0;
    }
    check(!result.errors.length, '実行時エラーなし');
    result.status = 'OK';
  } catch (error) { result.status = 'FAILED'; result.failure = String(error.stack || error); }
  finally { clearInterval(heartbeat); output(); }
})();
</script></body></html>
