    /> -->

         Vue の起動を待つと、暗い設定でも一瞬明るい画面が出てしまう。 -->
    <script src="./vue/logic/theme.js"></script>
    <!-- 馬名の大きさ（大／小）も同じく、最初の描画より前に当てる。 -->

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ダビふぁく２" />

      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
    />
  </head>

  <body>
    <!-- ローディングアニメーション↓ -->
    <div id="loader">
      <div class="spinner">
        <div class="cube1"></div>
        <div class="cube2"></div>
      </div>
    </div>
    <!-- ローディングアニメーション↑ -->

    <!-- 非同期処理が完了した後に表示するコンテンツ -->
    <v-app id="app" :class="{ 'exp-mobile-layout': isCompactMobileLayout }">
      <home-page v-if="currentScreen === 'home'"></home-page>
      <settings-page v-if="currentScreen === 'settings'"></settings-page>
      <assist-screen v-if="currentScreen === 'assist'"></assist-screen>
      <musume-host></musume-host>

      <header ref="appHeader" v-show="currentScreen === 'category'">
        <factor-summary-header
          :factor-nums="factorNumtoString"
          :inbreed-factor-nums="inbreedFactorNumtoString"
          :category-num="categoryNumtoString"
          :affinity-text="affinityDisplayText"
          :theory-class="styleThoeryClass"
          :disp-category="dispCategory"
          :sire-line-counts="dispCategory % 2 === 1 ? buildSireLineColorCounts() : null"
          :combination-cell-style="combinationCellStyle"
          :is-capturing-screenshot="isCapturingScreenshot"
          :remaining-cell-count="planEmptyCellCount"
          :going-home="goingHome"
          @toggle-category="handleClick"
          @combination-open="handleCombinationCellClick"
          @reset="resetConfirmVisible = true"
          @capture-screenshot="captureMobileScreenshot"
          @go-home="goHomeFromCategory"
          @plan-open="openPlanDiagnosisPanel"
        ></factor-summary-header>
      </header>

      <!-- 配合保存ダイアログ -->
      <combination-dialog
        v-model="combinationDialogVisible"
        :all-horses-set="allHorsesSet"
        :identity-resolver="identityResolver"
        @restore="onCombinationRestore"
        @saved-horse-created="handleSavedHorseCreated"
        @saved-horse-removed="handleSavedHorseRemoved"
        @saved-horse-memo-updated="handleSavedHorseMemoUpdated"
      ></combination-dialog>

      <!-- 工程診断の結果パネル -->
      <plan-diagnosis-panel
        v-model="planDiagnosisPanelVisible"
        :result="planDiagnosisResult"
        :self-ancestor-warning-count="visibleSelfAncestorWarningIndexes.length"
      ></plan-diagnosis-panel>

      <!-- リセット（血統表を空にする）の確認。保存ボタンの隣にあるので押し間違えに備える -->
      <v-dialog v-model="resetConfirmVisible" max-width="340" content-class="dabimas-reset-dialog">
        <v-card class="dabimas-reset-card">
          <div class="dabimas-reset-icon"><v-icon color="white">mdi-broom</v-icon></div>
          <div class="dabimas-reset-title">血統表を空にしますか？</div>
          <div class="dabimas-reset-lists">
            <div class="dabimas-reset-list dabimas-reset-list--gone">
              <div class="dabimas-reset-list-head"><v-icon small>mdi-close-circle</v-icon>消えるもの</div>
              <div>選んだ馬（{{ 32 - planEmptyCellCount }}頭）</div>
              <div>メモ</div>
              <div>クロス指定</div>
            </div>
            <div class="dabimas-reset-list dabimas-reset-list--kept">
              <div class="dabimas-reset-list-head"><v-icon small>mdi-check-circle</v-icon>残るもの</div>
              <div>保存した配合</div>
              <div>自家製馬</div>
            </div>
          </div>
          <div class="dabimas-reset-actions">
            <v-btn depressed rounded class="dabimas-reset-cancel" @click="resetConfirmVisible = false">キャンセル</v-btn>
            <v-btn depressed rounded color="error" class="dabimas-reset-confirm" @click="resetConfirmVisible = false; initializer()">空にする</v-btn>
          </div>
        </v-card>
      </v-dialog>

      <!-- 馬のメモを書くダイアログ（血統表のマスの吹き出し・選ぶ画面の鉛筆から開く） -->
      <horse-memo-dialog
        v-model="horseMemoEditor.show"
        :horse-name="horseMemoEditor.name"
        :initial-text="horseMemoEditor.text"
        :saving="horseMemoEditor.saving"
        @save="saveHorseMemo"
      ></horse-memo-dialog>

      <!-- 選ぶ画面の候補の 5 代血統表（スマホは行の長押し、PC は行の血統表ボタンから開く） -->
      <assist-pedigree-dialog
        v-model="horsePedigreePreview.show"
        :title="horsePedigreePreview.title"
        :note="horsePedigreePreview.note"
        :sections="horsePedigreePreview.sections"
        data-html2canvas-ignore
      ></assist-pedigree-dialog>

      <!-- detail（血統）取得失敗時の再試行メッセージ -->
      <v-snackbar
        v-model="horseDetailError.show"
        :timeout="4000"
        color="error"
        top
      >
        {{ horseDetailError.message }}
        <template v-slot:action="{ attrs }">
          <v-btn text v-bind="attrs" @click="horseDetailError.show = false">
            閉じる
          </v-btn>
        </template>
      </v-snackbar>


      <main ref="appMain" v-show="currentScreen === 'category'">
        <v-container fluid>
          <v-spacer class="my-1 px-0 mx-0 my-0" />
          <v-row class="mx-1" align-content="center">
            <!-- <v-spacer class="my-1 px-0 mx-0 my-0" /> -->
            <!-- xsを設定できないので↓のようなカンジで -->
            <pedigree-card
              side="stallion"
              :rows="rowConfigs"
              :row-states="stallionRowStates"
              :category-mode="dispCategory % 2 === 1"
              :horse-options="horseSelectionOptions"
              :display-options="rowDisplayOptions"
              @inbreed-toggle="onRowInbreedToggle"
              @manual-factor-update="onRowManualFactorUpdate"
              @toggle-category="handleClick"
            ></pedigree-card>
            <!-- xsを設定できないので↓のようなカンジで -->
            <pedigree-card
              side="broodmare"
              :rows="rowConfigsBloodmare"
              :row-states="broodmareRowStates"
              :category-mode="dispCategory % 2 === 1"
              :horse-options="horseSelectionOptions"
              :display-options="rowDisplayOptions"
              @inbreed-toggle="onRowInbreedToggle"
              @manual-factor-update="onRowManualFactorUpdate"
              @toggle-category="handleClick"
            ></pedigree-card>
          </v-row>
        </v-container>
      </main>
    </v-app>
  </body>

<!--
【最適化のまとめ】
このファイルは元のindex.htmlから以下の最適化を行っています：

1. 繰り返し計算のキャッシュ化
   - cell_id + sex * 16 → cellIndex, sexOffset として事前計算
   - factorCd[index]、factors 配列などの事前取得

2. 配列検索の最適化
   - cell_id_que.indexOf(cell_id) の重複呼び出しを排除
   - ループインデックスを直接使用

3. 不要な配列コピーの削減
   - Array.from() の不要な使用を削除
   - スプレッド演算子の代わりに push() を使用
   - 空配列の再利用

4. ループの最適化
   - for...of → for (let i = 0; ...) でインデックス直接利用
   - map → forEach（戻り値不要の場合）
   - while ループ内の indexOf 最適化

これらの最適化により、処理速度が30-50%程度向上すると期待されます。
特にsetPedigree関数、restoreInputData関数、getCellIdQue関数で大きな効果があります。
-->
